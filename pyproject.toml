[project]
name = "sciscope"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1,<2",
    "fastapi>=0.115,<1",
    "ir-measures>=0.4.3",
    "pgvector>=0.5.1,<0.6",
    "psycopg[binary]>=3.3.9,<4",
    "pydantic>=2.7,<3",
    "rank-bm25==0.2.2",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.0.58,<2.1",
    "uvicorn>=0.30,<1",
]

# Development and application dependencies for approved features.
[dependency-groups]
dev = [
    "httpx>=0.27,<0.29",
    "jsonschema>=4.23,<5",
    "mypy>=1.18,<2",
    "pytest>=8,<9",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "live: calls a paid external provider; skipped unless explicitly enabled",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true
