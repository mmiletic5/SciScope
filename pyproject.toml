[project]
name = "sciscope"
version = "0.0.0"
requires-python = ">=3.12,<3.13"
dependencies = []

# Bootstrap tooling only. Application dependencies need approved feature plans.
[dependency-groups]
dev = [
    "jsonschema>=4.23,<5",
    "mypy>=1.18,<2",
    "pytest>=8,<9",
    "ruff>=0.14,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 80

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
